<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERSO SUPPLY - Master Supplier List with QR</title>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- QRCode.js for generating QR Codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- BoxIcons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        .header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .table-container {
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem 1rem;
            font-weight: 600;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: #e2e8f0;
            vertical-align: middle;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        tr:last-child td {
            border-bottom: none;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .qr-cell {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .qr-container {
            background: white;
            padding: 5px;
            border-radius: 8px;
            display: inline-block;
        }
        
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #25D366;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.2s, background 0.2s;
        }

        .whatsapp-btn:hover {
            background: #128C7E;
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .video-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(225, 48, 108, 0.1);
            color: #e1306c;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .video-link:hover {
            background: rgba(225, 48, 108, 0.2);
            color: #e1306c;
            text-decoration: none;
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>VERSO SUPPLY</h1>
        <p>Master Supplier List — Connectez-vous instantanément via WhatsApp</p>
    </div>

    <div class="container">
        <div class="table-container">
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <div>Chargement des données depuis Google Sheets...</div>
            </div>
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th>🎥 Vidéo</th>
                        <th>🤖 Catégorie</th>
                        <th>📍 Site / Alibaba</th>
                        <th>🏭 Fournisseur</th>
                        <th>📱 QR Code WhatsApp</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjIjBAUE8259RZev0U_pLAM2bKF3idLGLl8x5ZhAY1WKlGczrpN2OkivBggyFow1Z6E1KvdpZrX8mQ/pub?gid=0&single=true&output=csv";
        const DEFAULT_PHONE = "85252064830";

        // Extract phone number from a string
        function extractPhoneNumber(text) {
            if (!text) return null;
            // Matches international format like +86 13602685929, +33 7 43 01 19 92, etc.
            const phoneRegex = /(?:\+|00)\s*([0-9]{1,3})[\s\-]*([0-9]{1,4})[\s\-]*([0-9]{1,4})[\s\-]*([0-9]{1,4})[\s\-]*([0-9]{0,4})/g;
            const matches = [...text.matchAll(phoneRegex)];
            if (matches.length > 0) {
                // Return the first match cleaned up
                let num = matches[0][0].replace(/[\s\-]/g, '');
                // Replace 00 with + at the start if needed, but wa.me accepts just numbers
                num = num.replace(/^\+/, '');
                num = num.replace(/^00/, '');
                return num;
            }
            
            // Try matching local numbers if international fails, very basic check
            const basicPhoneRegex = /tel\s*:\s*([0-9]{8,15})/i;
            const basicMatch = text.match(basicPhoneRegex);
            if(basicMatch) return basicMatch[1];

            return null;
        }

        // Fetch and parse the CSV
        Papa.parse(CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const data = results.data;
                const tbody = document.getElementById('tableBody');
                
                // Find where the actual data starts (header row contains "Vidéo")
                let startIndex = 0;
                for (let i = 0; i < data.length; i++) {
                    if (data[i][0] && data[i][0].includes("Vidéo")) {
                        startIndex = i + 1;
                        break;
                    }
                }

                for (let i = startIndex; i < data.length; i++) {
                    const row = data[i];
                    // Skip empty rows
                    if (!row || row.length < 4 || (!row[0] && !row[1] && !row[2] && !row[3])) continue;

                    const video = row[0] || "";
                    const category = row[1] || "";
                    const site = row[2] || "";
                    const supplier = row[3] || "";

                    // Extract phone number from Supplier or Site
                    let phoneNumber = extractPhoneNumber(supplier) || extractPhoneNumber(site);
                    
                    const tr = document.createElement('tr');

                    // Video Column
                    let videoHtml = video;
                    if (video.startsWith('http')) {
                        videoHtml = `<a href="${video}" target="_blank" class="video-link"><i class='bx bxl-instagram'></i> Voir Vidéo</a>`;
                    }

                    // Site Column
                    let siteHtml = site;
                    if (site.startsWith('http')) {
                        siteHtml = `<a href="${site}" target="_blank">Lien <i class='bx bx-link-external' ></i></a>`;
                    }

                    let qrHtml = "";
                    if (phoneNumber) {
                        let waLink = `https://wa.me/${phoneNumber}`;
                        qrHtml = `
                            <div class="qr-cell">
                                <div class="qr-container" id="qr-${i}"></div>
                                <a href="${waLink}" target="_blank" class="whatsapp-btn">
                                    <i class='bx bxl-whatsapp' style='font-size: 1.2rem'></i>
                                    Contacter
                                </a>
                            </div>
                        `;
                    } else {
                        qrHtml = `<span style="color: var(--text-muted); font-size: 0.9em;">Aucun numéro trouvé</span>`;
                    }

                    tr.innerHTML = `
                        <td>${videoHtml}</td>
                        <td><span class="badge">${category}</span></td>
                        <td>${siteHtml}</td>
                        <td>${supplier}</td>
                        <td>${qrHtml}</td>
                    `;
                    tbody.appendChild(tr);

                    // Generate QR Code after rendering if phone exists
                    if (phoneNumber) {
                        new QRCode(document.getElementById(`qr-${i}`), {
                            text: `https://wa.me/${phoneNumber}`,
                            width: 64,
                            height: 64,
                            colorDark : "#000000",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.L
                        });
                    }
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';
            },
            error: function(err) {
                console.error("Error fetching CSV:", err);
                document.getElementById('loading').innerHTML = "Erreur de chargement des données. Veuillez réessayer.";
            }
        });
    </script>
</body>
</html>
